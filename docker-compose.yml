services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ClientOrigin: http://localhost:5173
      EnableHttpsRedirection: "false"
      ConnectionStrings__GameDatabase: Data Source=/data/roguenet.db
    ports:
      - "127.0.0.1:5130:8080"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

  client:
    build:
      context: ./src/RogueNetClient
    environment:
      VITE_API_BASE_URL: http://localhost:5130
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      api:
        condition: service_healthy
